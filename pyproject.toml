[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "fastqueue-cli"
dynamic = ["version"]
description = "CLI for FastQueue"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache"
license-files = ["LICENSE"]
dependencies = ["typer", "requests"]

[project.scripts]
fastqueue = "fastqueue_cli.cli:app"

[project.optional-dependencies]
dev = ["black", "ruff"]

[tool.pdm]
version = { source = "file", path = "src/fastqueue_cli/__init__.py" }

[tool.black]
line-length = 79
include = '\.pyi?$'
preview = true

[tool.ruff]
[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "C",   # flake8-comprehensions
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # line too long, handled by black
  "B008", # do not perform function calls in argument defaults
  "C901", # complexity
  "N806", # variable in function should be lowercase (allows CamelCase for pydantic models)
]
exclude = [".git", ".ruff_cache", ".venv"]
